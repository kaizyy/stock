name: Regression Check

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'server.py'
      - 'runner.py'
      - 'dashboard_runner.py'
      - 'app_runner.py'
      - 'index.html'
      - 'app.js'
      - 'dashboard_metrics.js'
      - 'settings.js'
      - 'features.js'
      - 'features_optional_fix.js'
      - 'role_dashboard.js'
      - 'average_sale_price.js'
      - 'analytics_dashboard.js'
      - 'inventory_intelligence.js'
      - 'tools/regression_check.py'
      - 'tools/**'
      - 'tests/**'
      - 'docs/**'
      - 'Dockerfile'
      - '.github/workflows/regression.yml'

jobs:
  regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stockroom
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: stockroom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockroom -d stockroom_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install test dependencies
        run: |
          python -m pip install "psycopg[binary]>=3.2,<4"
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Python syntax and regression checks
        run: |
          python -m py_compile server.py runner.py dashboard_runner.py app_runner.py tools/regression_check.py tests/test_security.py tests/test_tenant_isolation.py tests/test_low_stock.py
          python tools/regression_check.py
          python -m unittest discover -s tests -v
        env:
          TEST_DATABASE_URL: postgresql://stockroom:test-password@localhost:5432/stockroom_test

      - name: Backup and restore verification
        run: |
          createdb --host=localhost --username=stockroom stockroom_restore
          backup=$(BACKUP_DIR="$RUNNER_TEMP/backups" tools/backup-postgres.sh)
          tools/verify-restore.sh "$backup"
        env:
          PGPASSWORD: test-password
          DATABASE_URL: postgresql://stockroom:test-password@localhost:5432/stockroom_test
          RESTORE_DATABASE_URL: postgresql://stockroom:test-password@localhost:5432/stockroom_restore

      - name: JavaScript syntax checks
        run: |
          node --check app.js
          node --check dashboard_metrics.js
          node --check settings.js
          node --check features.js
          node --check features_optional_fix.js
          node --check role_dashboard.js
          node --check average_sale_price.js
          node --check analytics_dashboard.js
          node --check inventory_intelligence.js
          node tests/dashboard_metrics.test.js
