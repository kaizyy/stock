name: Regression Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.py'
      - '*.js'
      - 'index.html'
      - 'tools/**'
      - 'tests/**'
      - 'docs/**'
      - 'Dockerfile'
      - '.github/workflows/regression.yml'

jobs:
  regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stockroom
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: stockroom_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U stockroom -d stockroom_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: Install test dependencies
        run: |
          python -m pip install "psycopg[binary]>=3.2,<4" "reportlab>=4.2,<5"
          sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Python syntax and regression checks
        run: |
          python -m py_compile server.py runner.py dashboard_runner.py app_runner.py order_management.py order_delete.py warehouse_ops.py business_tools.py platform_admin.py billing.py account_tools.py email_events.py security_integrations.py backup_status.py extended_runner.py tools/regression_check.py tests/*.py
          python tools/regression_check.py
          python -m unittest discover -s tests -v
        env:
          TEST_DATABASE_URL: postgresql://stockroom:test-password@localhost:5432/stockroom_test
          SECURITY_ENCRYPTION_KEY: ci-test-security-key
      - name: Backup and restore verification
        run: |
          createdb --host=localhost --username=stockroom stockroom_restore
          export BACKUP_DIR="$RUNNER_TEMP/backups"
          backup=$(tools/backup-postgres.sh)
          tools/verify-restore.sh "$backup"
          test -s "$BACKUP_DIR/last-restore-test.ok"
        env:
          PGPASSWORD: test-password
          DATABASE_URL: postgresql://stockroom:test-password@localhost:5432/stockroom_test
          RESTORE_DATABASE_URL: postgresql://stockroom:test-password@localhost:5432/stockroom_restore
      - name: JavaScript syntax checks
        run: |
          for f in *.js; do node --check "$f"; done
          node tests/dashboard_metrics.test.js
