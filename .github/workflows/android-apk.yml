name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'app_runner.py'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'app_runner.py'
      - '.github/workflows/android-apk.yml'

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Record run id
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p .ci
          printf '%s\n' "$GITHUB_RUN_ID" > .ci/android-latest-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/android-latest-run.txt
          git commit -m "ci: record Android APK run $GITHUB_RUN_ID" || true
          git push || true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build debug APK
        env:
          STOCKROOM_BASE_URL: ${{ vars.STOCKROOM_BASE_URL || 'https://stock.example.nl' }}
        run: gradle -p android assembleDebug -PSTOCKROOM_BASE_URL="$STOCKROOM_BASE_URL" --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: stockroom-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish android-latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk stockroom-debug.apk
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest stockroom-debug.apk --title "Stockroom Android latest" --notes "Automatisch gebouwde debug-APK van main."
