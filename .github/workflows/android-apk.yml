name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'app_runner.py'
      - '.github/workflows/android-apk.yml'

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build debug APK
        env:
          STOCKROOM_BASE_URL: ${{ vars.STOCKROOM_BASE_URL || 'https://stock.example.nl' }}
        run: gradle -p android assembleDebug -PSTOCKROOM_BASE_URL="$STOCKROOM_BASE_URL" --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stockroom-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
