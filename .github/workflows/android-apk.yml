name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/build-android-trigger'

jobs:
  preflight:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stockroom
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: stockroom_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U stockroom -d stockroom_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python syntax and regression checks
        run: |
          python -m pip install "psycopg[binary]>=3.2,<4" "reportlab>=4.2,<5"
          python -m py_compile *.py tools/*.py tests/*.py
          python tools/regression_check.py
          python -m unittest discover -s tests -v
        env:
          TEST_DATABASE_URL: postgresql://stockroom:test-password@localhost:5432/stockroom_test

      - name: JavaScript syntax checks
        run: |
          for f in *.js; do node --check "$f"; done
          for f in tests/*.test.js; do node "$f"; done

  build-debug-apk:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-37"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build debug APK
        env:
          STOCKROOM_BASE_URL: ${{ vars.STOCKROOM_BASE_URL || 'https://stock.valerith.nl' }}
        run: gradle -p android clean lintDebug assembleDebug -PSTOCKROOM_BASE_URL="$STOCKROOM_BASE_URL" --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: stockroom-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
